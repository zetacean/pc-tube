[package]
name = "pc_tube"
version = "0.5.1"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
dirs = "6"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tray-icon = "0.26"
winreg = "0.56"
rfd = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
    "Data_Xml_Dom",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
global-hotkey = "0.10.0"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
strip = true
