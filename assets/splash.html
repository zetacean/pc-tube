<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PC Tube</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0f0f; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
         font: 14px Roboto, "Segoe UI", Arial, sans-serif; color: #9a9a9a; user-select: none; }
  .spin { width: 30px; height: 30px; border: 3px solid #2a2a2a; border-top-color: #ff6a3d;
          border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  /* invisible strip at the top so the window can be dragged while loading */
  #pctube-loadbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; }
</style>
</head>
<body>
<div id="pctube-loadbar"></div>
<svg width="96" height="96" viewBox="0 0 256 256" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#d6246e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#g)"/>
  <rect x="57" y="67" width="142" height="98" rx="10" fill="none" stroke="#fff" stroke-width="14"/>
  <rect x="94" y="189" width="68" height="14" rx="7" fill="#fff"/>
  <rect x="121" y="164" width="14" height="28" rx="2" fill="#fff"/>
  <path d="M110 88 L110 144 L162 116 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
</svg>
<div class="spin"></div>
<div>Cargando YouTube…</div>
<script>
  // Let the splash paint at least one frame, then go to YouTube (replace: no history entry).
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { location.replace("{{URL}}"); });
  });
</script>
</body>
</html>
